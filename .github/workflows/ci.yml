name: Build and lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/scanner-success-popup]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check code
        run: npm run lint

      - name: Build app
        run: npm run build
